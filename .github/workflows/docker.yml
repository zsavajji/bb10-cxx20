# Publishes Dockerfile.release's image to ghcr.io/<owner>/bb10-cxx20 when a
# release is published (or by hand, for a release tag), tagged with the
# release and as latest.
name: Docker image

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release:
        description: Release tag whose bb10-cxx20.tar.gz goes into the image
        required: true

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Release and checksum
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.release }}
        run: |
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern bb10-cxx20.tar.gz
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "sha256=$(sha256sum bb10-cxx20.tar.gz | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      # For the arm64 image (Apple Silicon Macs, ARM Linux): XIAZY's image
      # has both, and Dockerfile.release only unpacks files.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.release
          platforms: linux/amd64,linux/arm64
          build-args: |
            BB10_CXX20_RELEASE=${{ steps.release.outputs.tag }}
            BB10_CXX20_SHA256=${{ steps.release.outputs.sha256 }}
          tags: |
            ${{ steps.release.outputs.image }}:${{ steps.release.outputs.tag }}
            ${{ steps.release.outputs.image }}:latest
          push: true
